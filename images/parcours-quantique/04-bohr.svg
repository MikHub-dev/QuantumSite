/g></g><circle r="8" fill="#ff5a5f" filter="url(#glow)" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M450,385 L1110,300" keyPoints="0;0;1;1" keyTimes="0;0.45;0.72;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.449;0.45;0.71;0.73;1" dur="8s" repeatCount="indefinite"/></circle><text x="700.0" y="212.0" class="lbl" font-size="13" fill="#9aa0c8" text-anchor="start" >SPECTRE DE L'HYDROGÈNE (VISIBLE)</text><rect x="700" y="228" width="480" height="84" rx="8" fill="#05060f" stroke="#9aa0c8" stroke-opacity="0.5"/><line x1="1109.6" y1="232" x2="1109.6" y2="308" stroke="#ff5a5f" stroke-width="5" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.4;0.4;1;1;0.4" keyTimes="0;0.72;0.74;0.95;1" dur="8s" repeatCount="indefinite"/></line><line x1="837.6" y1="232" x2="837.6" y2="308" stroke="#3fd0ff" stroke-width="5" stroke-opacity="0.4"> </line><line x1="754.4" y1="232" x2="754.4" y2="308" stroke="#7a7bff" stroke-width="5" stroke-opacity="0.4"> </line><line x1="716.0" y1="232" x2="716.0" y2="308" stroke="#a56bff" stroke-width="5" stroke-opacity="0.4"> </line><circle cx="716" cy="374" r="7" fill="#ff5a5f"/><text x="732.0" y="380.0" class="sans" font-size="18" fill="#f3efe6" text-anchor="start" >saut 3→2  →  656 nm</text><circle cx="716" cy="404" r="7" fill="#3fd0ff"/><text x="732.0" y="410.0" class="sans" font-size="18" fill="#f3efe6" text-anchor="start" >saut 4→2  →  486 nm</text><circle cx="716" cy="434" r="7" fill="#7a7bff"/><text x="732.0" y="440.0" class="sans" font-size="18" fill="#f3efe6" text-anchor="start" >saut 5→2  →  434 nm</text><circle cx="716" cy="464" r="7" fill="#a56bff"/><text x="732.0" y="470.0" class="sans" font-size="18" fill="#f3efe6" text-anchor="start" >saut 6→2  →  410 nm</text><text x="700.0" y="520.0" class="serif" font-size="28" fill="#f2b84b" text-anchor="start" font-style="italic">ΔE = E₃ − E₂ = h·ν</text><text x="700.0" y="552.0" class="sans" font-size="17" fill="#9aa0c8" text-anchor="start" >le saut n'est jamais « vu » entre les deux orbites</text><rect x="40" y="604" width="1200" height="96" rx="18" fill="#fff" fill-opacity="0.05"/><line x1="640" y1="620" x2="640" y2="684" stroke="#9aa0c8" stroke-opacity="0.35"/><text x="64.0" y="630.0" class="lbl" font-size="13" fill="#f2b84b" text-anchor="start" >MOUVEMENT</text><text x="64.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >L'électron tourne, saute de n = 3 à n = 2 sans passer</text><text x="64.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >entre les deux, et émet un photon rouge (656 nm).</text><text x="664.0" y="630.0" class="lbl" font-size="13" fill="#f2b84b" text-anchor="start" >TRANSITION  →</text><text x="664.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >Ça marche pour l'hydrogène, mais personne ne sait</text><text x="664.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >décrire le saut. Heisenberg change de méthode.</text></svg>