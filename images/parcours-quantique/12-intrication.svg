r hasard</text><text x="640.0" y="238.0" class="sans" font-size="21" fill="#f2b84b" text-anchor="middle" >mais les deux suites coïncident quand on les compare</text><rect x="352" y="540" width="576" height="38" rx="19" fill="none" stroke="#9aa0c8" stroke-opacity="0.55"/><text x="640.0" y="565.0" class="sans" font-size="16" fill="#9aa0c8" text-anchor="middle" >Prix Nobel de physique 2022 : Aspect, Clauser, Zeilinger</text><rect x="40" y="604" width="1200" height="96" rx="18" fill="#fff" fill-opacity="0.05"/><line x1="640" y1="620" x2="640" y2="684" stroke="#9aa0c8" stroke-opacity="0.35"/><text x="64.0" y="630.0" class="lbl" font-size="13" fill="#5ad1e6" text-anchor="start" >MOUVEMENT</text><text x="64.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >Chaque détecteur affiche une suite aléatoire de 0 et 1,</text><text x="64.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >mais les deux suites sont identiques.</text><text x="664.0" y="630.0" class="lbl" font-size="13" fill="#5ad1e6" text-anchor="start" >TRANSITION  →</text><text x="664.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >Aucun message ne voyage plus vite que la lumière. Mais</text><text x="664.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >l'environnement brouille ces liens.</text></svg>