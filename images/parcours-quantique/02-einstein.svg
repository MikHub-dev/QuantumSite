 stroke="#9aa0c8" stroke-opacity="0.35"/><text x="64.0" y="630.0" class="lbl" font-size="13" fill="#f2b84b" text-anchor="start" >MOUVEMENT</text><text x="64.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >Des photons rouges rebondissent sur le métal ;</text><text x="64.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >un seul photon violet éjecte un électron.</text><text x="664.0" y="630.0" class="lbl" font-size="13" fill="#f2b84b" text-anchor="start" >TRANSITION  →</text><text x="664.0" y="656.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >Si l'énergie vient par grains, qu'en est-il de la</text><text x="664.0" y="680.0" class="sans" font-size="19" fill="#f3efe6" text-anchor="start" >matière ? Rutherford dessine l'atome.</text></svg>