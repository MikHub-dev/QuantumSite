<text x="664" y="626" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f2b84b" text-anchor="start" font-weight="700" letter-spacing="2.5">D'OÙ VIENT LA COLLE ?</text><text x="664" y="650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >De l'interaction forte, portée par les gluons.</text><text x="664" y="674" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >C'est elle que décrit la QCD.</text>
</svg>