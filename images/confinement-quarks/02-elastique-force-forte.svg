<text x="380" y="502" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9aa0c8" text-anchor="middle" font-weight="400" >distance r</text>
<text x="380" y="300" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f2b84b" text-anchor="middle" font-weight="400" >tube de champ de couleur (gluons)</text>
<text x="380" y="560" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#f3efe6" text-anchor="middle" font-weight="400" >plus r grandit, plus la force qui les retient augmente</text>
<line x1="790" y1="520" x2="1200" y2="520" stroke="#9aa0c8" stroke-width="2" marker-end="url(#am)"/>
<line x1="790" y1="520" x2="790" y2="260" stroke="#9aa0c8" stroke-width="2" marker-end="url(#am)"/>
<text x="1196" y="548" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#9aa0c8" text-anchor="end" font-weight="400" >r</text>
<text x="802" y="276" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#9aa0c8" text-anchor="start" font-weight="400" >V(r)</text>
<line x1="790" y1="520" x2="1140" y2="340" stroke="#f2b84b" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
<circle r="10" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="840;1090;1090;840" keyTimes="0;.6;.85;1" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="494.3;365.8;365.8;494.3" keyTimes="0;.6;.85;1" dur="7s" repeatCount="indefinite"/></circle>
<text x="1200" y="262" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#f2b84b" text-anchor="end" font-weight="400" >V(r) ≈ σ · r</text>
<text x="1200" y="288" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0c8" text-anchor="end" font-weight="400" >σ : tension constante, comme celle d'une corde</text>
<path d="M790,534 v8 h60 v-8" fill="none" stroke="#5ad1e6" stroke-width="1.5"/>
<text x="860" y="560" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5ad1e6" text-anchor="start" font-weight="400" >r très petit : force faible (« liberté asymptotique »)</text>
<rect x="60" y="600" width="1160" height="96" rx="18" fill="#1d2048" fill-opacity=".92"/>
<line x1="640" y1="620" x2="640" y2="676" stroke="#9aa0c8" stroke-opacity=".45"/>
<text x="84" y="626" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f2b84b" text-anchor="start" font-weight="700" letter-spacing="2.5">L'IMAGE DE L'ÉLASTIQUE</text><text x="84" y="650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >Plus on tire, plus il résiste : l'énergie du</text><text x="84" y="674" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >système croît en ligne droite avec la distance.</text>
<text x="664" y="626" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f2b84b" text-anchor="start" font-weight="700" letter-spacing="2.5">CONTRE-INTUITIF</text><text x="664" y="650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >À l'inverse de la gravité ou de l'électricité,</text><text x="664" y="674" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >la force ne s'affaiblit pas quand on s'éloigne.</text>
</svg>