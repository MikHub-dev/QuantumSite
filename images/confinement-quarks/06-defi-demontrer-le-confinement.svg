<text x="84" y="626" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f2b84b" text-anchor="start" font-weight="700" letter-spacing="2.5">OBSERVÉ, PAS DÉMONTRÉ</text><text x="84" y="650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >Les quarks restent enfermés, mais personne n'a</text><text x="84" y="674" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >prouvé rigoureusement que la QCD l'impose.</text>
<text x="664" y="626" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f2b84b" text-anchor="start" font-weight="700" letter-spacing="2.5">POURQUOI C'EST IMPORTANT</text><text x="664" y="650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >Le comprendre, c'est comprendre une propriété</text><text x="664" y="674" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#f3efe6" text-anchor="start" font-weight="400" >essentielle de notre Univers.</text>
