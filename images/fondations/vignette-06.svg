<title id="t6">La métaphore des étangs superposés</title><desc id="d6">Trois nappes empilées : le champ électronique, le champ électromagnétique et les autres champs (quarks, gluons, Higgs). Une vague du champ électronique transmet de l'énergie au champ électromagnétique par couplage, et un photon est émis.</desc>
