<!-- QuantumSite — Fondations, vignette 13 — version 1.0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" role="img" aria-labelledby="t13 d13" data-version="1.0">
<title id="t13">Le problème de la masse</title><desc id="d13">Une balance penche : la théorie symétrique exige des bosons W et Z sans masse, l'expérience (CERN, 1983) les trouve très massifs, mW ≈ 80,4 GeV/c² et mZ ≈ 91,2 GeV/c². La masse d'un porteur de force limite sa portée : infinie pour le photon, environ 10⁻¹⁸ m pour W et Z.</desc>
