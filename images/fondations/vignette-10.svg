<title id="t10">Kenneth Wilson : des théories effectives</title><desc id="d10">Zoom à travers les échelles : humaine (1 m), atome (10⁻¹⁰ m), noyau (10⁻¹⁵ m), échelle de Planck (10⁻³⁵ m), puis une physique inconnue. La théorie quantique des champs est une théorie effective, excellente sur une large gamme d'échelles.</desc>
