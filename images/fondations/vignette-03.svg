<title id="t3">La quantification</title><desc id="d3">Un escalier de niveaux d'énergie : l'électron saute d'une marche à une autre en émettant un photon d'énergie hν. Dessous, le spectre continu prévu par la physique classique et les raies observées de l'hydrogène. Planck 1900, Einstein 1905, Bohr 1913.</desc>
