<title id="t8">La crise des infinis</title><desc id="d8">Diagrammes d'un électron interagissant avec son propre champ : sans boucle le calcul est fini, mais chaque correction avec boucles de photons diverge. La masse calculée devient infinie, δm ∝ ln Λ quand la coupure Λ tend vers l'infini.</desc>
