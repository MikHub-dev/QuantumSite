<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>50 notions quantiques en flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8;--panel:#FFFFFF;--ink:#1A2147;--muted:#6B7196;--line:#D3D7EA;
  --acc:#D98710;--acc2:#4B45C9;--acc-s:#FBEBD0;--acc2-s:#E3E2FA;--muted-s:#E8EAF3;
  --serif:"Spectral","Cambria Math","STIX Two Text","Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141838;--panel:#1C2150;--ink:#E8EAF7;--muted:#9CA2CA;--line:#363D77;
    --acc:#F2B33D;--acc2:#A39DFF;--acc-s:#4A3A1C;--acc2-s:#302E70;--muted-s:#272D5C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141838;--panel:#1C2150;--ink:#E8EAF7;--muted:#9CA2CA;--line:#363D77;
  --acc:#F2B33D;--acc2:#A39DFF;--acc-s:#4A3A1C;--acc2-s:#302E70;--muted-s:#272D5C;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5.5vw,38px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.stats{color:var(--muted);font-size:14px;margin:0}
.fringes{display:grid;grid-template-columns:repeat(50,minmax(0,1fr));gap:2px;height:36px;margin:22px 0 8px;align-items:end}
.fringes button{appearance:none;border:0;padding:0;margin:0;cursor:pointer;height:20px;border-radius:1px;background:var(--line);transition:height .2s}
.fringes button.ok{background:var(--acc2)}
.fringes button.rev{background:var(--acc)}
.fringes button.cur{height:36px}
.fringes button.cur:not(.ok):not(.rev){background:var(--ink)}
.fringes button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:6px 18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pos{font-size:14px;color:var(--muted);margin:0 0 10px;min-height:21px}
.card{perspective:1400px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.inner{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 24px 28px;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.back{transform:rotateY(180deg)}
.card:focus-visible .face{outline:2px solid var(--acc2);outline-offset:3px}
.ill{width:100%;max-width:430px;height:auto;display:block}
.ill.small{max-width:190px}
.meta{font-size:13px;color:var(--muted);margin:14px 0 0}
.term{font-family:var(--serif);font-weight:500;font-size:clamp(27px,5.8vw,36px);line-height:1.15;margin:4px 0 0}
.term.sm{font-size:clamp(22px,4.6vw,27px)}
.def{font-family:var(--serif);font-size:clamp(18px,3.6vw,21px);line-height:1.62;max-width:54ch;margin:14px 0 0;text-align:left}
.hint{font-size:13px;color:var(--muted);margin:16px 0 0}
.empty .def{text-align:center}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:10px;margin-top:16px}
.btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.opts input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn.rev{border-color:var(--acc)}
.btn.rev[aria-pressed="true"]{background:var(--acc-s)}
.btn.ok{border-color:var(--acc2)}
.btn.ok[aria-pressed="true"]{background:var(--acc2-s)}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:22px;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--acc2);width:16px;height:16px;margin:0}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.keys{font-size:13px;color:var(--muted);margin:14px 0 0}
.tx{font-family:var(--serif);fill:var(--ink)}
.l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.l.a{stroke:var(--acc)}
.l.b{stroke:var(--acc2)}
.l.m{stroke:var(--muted)}
.l.d{stroke-dasharray:4 4}
.l.w1{stroke-width:1.2}
.sa{fill:var(--acc-s)}
.sb{fill:var(--acc2-s)}
.sm{fill:var(--muted-s)}
.fa{fill:var(--acc)}
.fb{fill:var(--acc2)}
.fi{fill:var(--ink)}
.fm{fill:var(--muted)}
.ta{fill:var(--acc)}
.tb{fill:var(--acc2)}
.tm{fill:var(--muted)}
@media (max-width:520px){
  main{padding:20px 14px 32px}
  .face{min-height:380px;padding:18px 16px 22px}
  .btn{padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){
  .inner,.fringes button{transition:none}
}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <marker id="mi" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" class="fi"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" class="fa"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" class="fb"/></marker>
    <marker id="mm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" class="fm"/></marker>
  </defs>
</svg>
<main>
  <header>
    <h1>50 notions quantiques</h1>
    <p class="stats" id="stats"></p>
  </header>
  <nav class="fringes" id="fringes" aria-label="Accès direct aux 50 cartes"></nav>
  <div class="legend">
    <span><i style="background:var(--acc2)"></i>Connue</span>
    <span><i style="background:var(--acc)"></i>À revoir</span>
    <span><i style="background:var(--line)"></i>Pas encore marquée</span>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filtrer les cartes"></div>
  <p class="pos" id="pos" aria-live="polite"></p>
  <div id="stage"></div>
  <div class="controls">
    <button class="btn" id="prev" aria-label="Carte précédente">←</button>
    <button class="btn" id="flip">Retourner la carte</button>
    <button class="btn" id="next" aria-label="Carte suivante">→</button>
  </div>
  <div class="mark">
    <button class="btn rev" id="markRev" aria-pressed="false">À revoir</button>
    <button class="btn ok" id="markOk" aria-pressed="false">Je la connais</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="shuffle"> Mélanger</label>
    <label><input type="checkbox" id="defFirst"> Définition d’abord</label>
    <button class="link" id="reset">Effacer mes marques</button>
  </div>
  <p class="keys">Clavier : flèches pour naviguer, espace pour retourner, R pour « à revoir », C pour « je la connais ». Sur mobile, balayez la carte.</p>
</main>

const f=n=>Math.round(n*10)/10;

const TXT=[
['Quantification','Certaines grandeurs, comme l’énergie, ne varient pas de façon continue : elles ne prennent que des valeurs discrètes, par paquets appelés quanta.'],
['Constante de Planck','La constante fondamentale h ≈ 6,626 × 10⁻³⁴ J·s, qui fixe l’échelle de tous les effets quantiques. Sa petitesse explique pourquoi ils passent inaperçus à notre échelle.'],
['Photon','Le quantum de lumière. Son énergie est proportionnelle à sa fréquence : E = h·f. Une lumière plus bleue transporte des photons plus énergétiques.'],
['Effet photoélectrique','La lumière n’arrache des électrons à un métal qu’au-delà d’une certaine fréquence, quelle que soit son intensité. Einstein l’a expliqué en 1905 par les photons.'],
['Dualité onde-particule','Tout objet quantique montre des aspects d’onde (il interfère) et de particule (il laisse des impacts ponctuels), selon l’expérience réalisée.'],
['Longueur d’onde de de Broglie','Toute particule de masse m et de vitesse v a une longueur d’onde λ = h / (m·v). Plus l’objet est lourd ou rapide, plus elle est petite.'],
['Niveaux d’énergie et spectres','Les électrons d’un atome n’occupent que des niveaux d’énergie précis. En sautant de l’un à l’autre, ils émettent ou absorbent un photon d’une couleur bien définie.'],
['Fentes d’Young','Des particules envoyées une à une vers deux fentes dessinent peu à peu des franges d’interférence : chacune interfère avec elle-même.'],
['État quantique','La description complète d’un système à un instant donné. Mathématiquement, c’est un vecteur, noté |ψ⟩.'],
['Espace de Hilbert','L’espace mathématique, souvent de dimension immense voire infinie, dans lequel vivent les vecteurs d’état.'],
['Notation de Dirac','La notation « bra-ket » : |ψ⟩ (ket) désigne un état, ⟨φ| (bra) son dual, et ⟨φ|ψ⟩ leur produit, qui donne une amplitude.'],
['Fonction d’onde','L’état exprimé en fonction de la position, ψ(x). Elle s’étale dans l’espace et peut osciller.'],
['Amplitude de probabilité','Un nombre complexe associé à chaque possibilité. Il a une grandeur et une phase, et peut donc s’additionner ou s’annuler avec d’autres amplitudes.'],
['Règle de Born','La probabilité d’un résultat est le carré du module de son amplitude : P = |ψ|². C’est le pont entre le formalisme et ce qu’on mesure.'],
['Superposition','Un état peut être une combinaison de plusieurs états à la fois, comme α|0⟩ + β|1⟩, tant qu’on ne le mesure pas.'],
['Interférence et phase','Selon leur phase relative, les amplitudes se renforcent ou s’annulent. C’est le moteur de presque tous les effets quantiques, et des algorithmes quantiques.'],
['Équation de Schrödinger','L’équation qui gouverne l’évolution d’un état dans le temps : iħ ∂ψ/∂t = Ĥψ, où Ĥ représente l’énergie du système.'],
['Évolution unitaire','Entre deux mesures, l’état évolue de façon continue, déterministe et réversible. Aucune information n’est perdue.'],
['Observable','Une grandeur mesurable (énergie, position, spin), représentée par un opérateur qui agit sur les états.'],
['États propres et valeurs propres','Les seuls résultats possibles d’une mesure sont les valeurs propres de l’opérateur. Juste après, le système se trouve dans l’état propre correspondant.'],
['Mesure','La mesure donne un résultat aléatoire et fait « s’effondrer » la superposition sur l’état correspondant. On parle de réduction du paquet d’ondes.'],
['Problème de la mesure','La question ouverte de savoir pourquoi la mesure semble obéir à une autre règle que l’évolution de Schrödinger, et où passe la frontière entre les deux.'],
['Principe d’incertitude','Position et quantité de mouvement ne peuvent pas être toutes deux parfaitement définies : Δx·Δp ≥ ħ/2. Ce n’est pas une limite des instruments.'],
['Non-commutation','Appliquer deux opérations dans un ordre ou dans l’autre ne donne pas le même résultat. C’est l’origine mathématique du principe d’incertitude.'],
['Complémentarité','L’idée de Bohr : les aspects onde et particule sont complémentaires. Une expérience peut révéler l’un ou l’autre, jamais les deux en même temps.'],
['Décohérence','Les interactions avec l’environnement détruisent très vite les superpositions. C’est pourquoi le monde à notre échelle paraît classique.'],
['Chat de Schrödinger','L’expérience de pensée de 1935 : un chat enfermé, dont le sort dépend d’un atome, serait à la fois mort et vivant. Elle souligne le problème de la mesure.'],
['Théorème de non-clonage','Il est impossible de copier parfaitement un état quantique inconnu. Cela complique la correction d’erreurs et fonde la sécurité de la distribution quantique de clés.'],
['Interprétations','Copenhague, Everett (multivers), Bohm (onde pilote), effondrement objectif, QBism : mêmes prédictions, visions différentes de la réalité.'],
['Spin','Un moment cinétique intrinsèque, sans équivalent classique exact. Mesuré selon un axe, celui de l’électron ne vaut que « haut » ou « bas ».'],
['Fermions et bosons','Les fermions (spin demi-entier : électrons, quarks) forment la matière. Les bosons (spin entier : photons, gluons) transmettent les interactions et peuvent s’empiler dans le même état.'],
['Principe d’exclusion de Pauli','Deux fermions identiques ne peuvent pas occuper le même état quantique. Cela structure les couches électroniques, donc toute la chimie.'],
['Particules indiscernables','Deux électrons sont strictement identiques : les échanger ne change rien à l’état. Cela modifie profondément la façon de les compter.'],
['Effet tunnel','Une particule peut franchir une barrière d’énergie qu’elle ne pourrait pas passer classiquement. Il fait briller le Soleil et fonctionner les mémoires flash.'],
['Énergie du point zéro','Même au zéro absolu, un système quantique garde une énergie minimale non nulle. Le vide lui-même fluctue.'],
['Théorie quantique des champs','Le cadre qui réunit quantique et relativité restreinte. Les particules y sont des excitations de champs qui remplissent l’espace. C’est la base du Modèle standard.'],
['Intrication','Deux systèmes partagent un même état global : leurs mesures restent corrélées même très loin l’une de l’autre, sans que chacun ait d’état propre bien défini.'],
['Paradoxe EPR','L’argument d’Einstein, Podolsky et Rosen (1935) : l’intrication montrerait que la quantique est incomplète et cache des propriétés préexistantes.'],
['Variables cachées locales','L’hypothèse que des propriétés invisibles, fixées à l’avance et sans influence à distance, expliqueraient les corrélations de l’intrication.'],
['Inégalités de Bell','Un test proposé par John Bell en 1964. Leur violation, mesurée notamment par Aspect, Clauser et Zeilinger (Nobel 2022), écarte les variables cachées locales.'],
['Non-signalisation','Malgré l’intrication, aucune information ne peut être transmise plus vite que la lumière : chaque résultat, pris seul, est purement aléatoire.'],
['Téléportation quantique','Transférer un état quantique d’un point à un autre grâce à une paire intriquée et à deux bits envoyés classiquement. L’état d’origine est détruit au passage.'],
['Qubit et sphère de Bloch','L’unité d’information quantique : α|0⟩ + β|1⟩. Son état se représente comme un point sur une sphère, la sphère de Bloch.'],
['Portes et circuits quantiques','Les opérations élémentaires sur les qubits, enchaînées en circuits. La porte Hadamard crée une superposition, la porte CNOT de l’intrication.'],
['Temps de cohérence','La durée pendant laquelle un qubit garde son état quantique avant que le bruit ne le dégrade, mesurée par les temps T1 et T2.'],
['Correction d’erreurs et qubit logique','Regrouper de nombreux qubits physiques bruités pour former un qubit logique fiable. C’est la clé des machines tolérantes aux fautes.'],
['Avantage quantique et ère NISQ','Le point où une machine quantique surpasse les ordinateurs classiques sur une tâche utile. L’ère NISQ désigne les machines bruitées actuelles, de taille intermédiaire.'],
['Algorithmes de Shor et de Grover','Shor factorise les grands nombres en temps raisonnable et menace RSA et les courbes elliptiques. Grover accélère la recherche, mais seulement de façon quadratique.'],
['Cryptographie quantique et post-quantique','La QKD (protocole BB84) échange des clés en s’appuyant sur la physique quantique. La cryptographie post-quantique utilise des algorithmes classiques conçus pour résister aux ordinateurs quantiques.'],
['Quantique macroscopique','Supraconductivité, superfluidité, condensats de Bose-Einstein, laser : des milliards de particules adoptent un comportement quantique collectif, visible à notre échelle.']
];
const THEMES=[['Fondations',1,8],['Formalisme',9,20],['Mesure',21,29],['Particules',30,36],['Intrication',37,42],['Technologies',43,50]];
const themeOf=n=>THEMES.find(t=>n>=t[1]&&n<=t[2])[0];
const CARDS=TXT.map((t,i)=>({n:i+1,term:t[0],def:t[1],theme:themeOf(i+1),art:ART[i],_svg:null}));
//@@APP
(function(){
const $=id=>document.getElementById(id);
const KEY='qflash-quantique-v1';
let status={};
try{const raw=localStorage.getItem(KEY);const v=raw?JSON.parse(raw):{};if(v&&typeof v==='object')status=v;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(status));}catch(e){}};
let filter='all',defFirst=false,flipped=false,pos=0;
let order=CARDS.map((_,i)=>i);
const buildDeck=()=>order.filter(i=>filter==='all'?true:filter==='rev'?status[CARDS[i].n]==='rev':CARDS[i].theme===filter);
let deck=buildDeck();
const cur=()=>deck.length?CARDS[deck[pos]]:null;
const svgOf=(c,cls)=>{if(!c._svg)c._svg=c.art();return `<svg class="ill ${cls||''}" viewBox="0 0 200 140" role="img" aria-label="Illustration : ${c.term}">${c._svg}</svg>`;};

const filters=[['all','Toutes']].concat(THEMES.map(t=>[t[0],t[0]])).concat([['rev','À revoir']]);
$('filters').innerHTML=filters.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="false">${l}</button>`).join('');
$('filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;deck=buildDeck();pos=0;flipped=false;render();});

$('fringes').innerHTML=CARDS.map((c,i)=>`<button data-i="${i}" aria-label="${c.n}. ${c.term}" title="${c.n}. ${c.term}"></button>`).join('');
$('fringes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;jump(+b.dataset.i);});

function jump(i){if(!deck.includes(i)){filter='all';deck=buildDeck();}pos=deck.indexOf(i);flipped=false;render();}

function render(){
  const ok=CARDS.filter(c=>status[c.n]==='ok').length,rev=CARDS.filter(c=>status[c.n]==='rev').length;
  $('stats').textContent=`${ok} connue${ok>1?'s':''}, ${rev} à revoir, ${50-ok-rev} pas encore marquée${50-ok-rev>1?'s':''}`;
  document.querySelectorAll('#filters .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===filter)));
  const c=cur();
  document.querySelectorAll('#fringes button').forEach((b,i)=>{const s=status[i+1];b.className=(s||'')+(c&&c.n===i+1?' cur':'');});
  const stage=$('stage');
  ['prev','next','flip','markRev','markOk'].forEach(id=>$(id).disabled=!c);
  if(!c){
    $('pos').textContent='';
    stage.innerHTML=`<div class="face empty"><h2 class="term sm">Aucune carte à revoir</h2><p class="def">Marquez une carte avec « À revoir » pour la retrouver dans ce filtre.</p></div>`;
    $('markRev').setAttribute('aria-pressed','false');$('markOk').setAttribute('aria-pressed','false');
    return;
  }
  const where=filter==='all'?'':filter==='rev'?' à revoir':` dans « ${filter} »`;
  $('pos').textContent=`Carte ${pos+1} sur ${deck.length}${where}`;
  const meta=`<p class="meta">${c.theme}, n° ${c.n}</p>`;
  let front,back;
  if(!defFirst){
    front=`${svgOf(c)}${meta}<h2 class="term">${c.term}</h2><p class="hint">Touchez la carte pour voir la définition</p>`;
    back=`${svgOf(c,'small')}${meta}<h2 class="term sm">${c.term}</h2><p class="def">${c.def}</p>`;
  }else{
    front=`<p class="meta">${c.theme}</p><p class="def">${c.def}</p><p class="hint">Quelle est cette notion ? Touchez pour vérifier.</p>`;
    back=`${svgOf(c)}${meta}<h2 class="term">${c.term}</h2>`;
  }
  stage.innerHTML=`<div class="card${flipped?' flipped':''}" id="card" tabindex="0" role="button" aria-label="Retourner la carte"><div class="inner"><div class="face front" aria-hidden="${flipped}">${front}</div><div class="face back" aria-hidden="${!flipped}">${back}</div></div></div>`;
  $('card').addEventListener('click',flip);
  $('flip').textContent=flipped?'Revenir au recto':'Retourner la carte';
  $('markRev').setAttribute('aria-pressed',String(status[c.n]==='rev'));
  $('markOk').setAttribute('aria-pressed',String(status[c.n]==='ok'));
}
function flip(){
  const card=$('card');if(!card)return;flipped=!flipped;card.classList.toggle('flipped',flipped);
  card.querySelector('.front').setAttribute('aria-hidden',String(flipped));card.querySelector('.back').setAttribute('aria-hidden',String(!flipped));
  $('flip').textContent=flipped?'Revenir au recto':'Retourner la carte';
}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;flipped=false;render();}
function mark(s){
  const c=cur();if(!c)return;
  const toggledOff=status[c.n]===s;
  if(toggledOff)delete status[c.n];else status[c.n]=s;
  save();
  if(filter==='rev'){deck=buildDeck();if(pos>deck.length-1)pos=Math.max(0,deck.length-1);flipped=false;render();return;}
  if(!toggledOff&&pos<deck.length-1){pos++;flipped=false;}
  render();
}
$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
$('flip').addEventListener('click',flip);
$('markRev').addEventListener('click',()=>mark('rev'));
$('markOk').addEventListener('click',()=>mark('ok'));
$('shuffle').addEventListener('change',e=>{
  if(e.target.checked){order=CARDS.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}deck=buildDeck();pos=0;}
  else{const ci=cur()?deck[pos]:null;order=CARDS.map((_,i)=>i);deck=buildDeck();pos=ci!=null&&deck.includes(ci)?deck.indexOf(ci):0;}
  flipped=false;render();
});
$('defFirst').addEventListener('change',e=>{defFirst=e.target.checked;flipped=false;render();});
let armed=false;
$('reset').addEventListener('click',()=>{
  if(!armed){armed=true;$('reset').textContent='Confirmer : tout effacer';return;}
  armed=false;status={};save();$('reset').textContent='Effacer mes marques';deck=buildDeck();pos=0;flipped=false;render();
});
$('reset').addEventListener('blur',()=>{armed=false;$('reset').textContent='Effacer mes marques';});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  const onBtn=e.target.tagName==='BUTTON';
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if((e.key===' '||e.key==='Enter')&&!onBtn){e.preventDefault();flip();}
  else if(e.key==='r'||e.key==='R'){mark('rev');}
  else if(e.key==='c'||e.key==='C'){mark('ok');}
});
let sx=null,sy=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){go(dx<0?1:-1);}},{passive:true});
render();
})();
</script>
</body>
</html>
